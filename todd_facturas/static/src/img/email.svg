<?xml version="1.0" encoding="UTF-8"?>
<!-- Pictograma de correo para el portal.
     Importante: llevar width/height explicitos (64x64). Si solo se declara
     viewBox, el navegador renderiza el <img> al tamanio por defecto
     (300x150 -> 150x150) y el icono se ve desproporcionado frente al resto
     de las tarjetas. Los colores tambien deben ser literales: un SVG cargado
     via <img> no hereda `currentColor` del documento HTML. -->
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="7" y="15" width="50" height="34" rx="4" fill="#C1DBF6" stroke="#374874" stroke-width="2.5"/>
    <path d="M8.5 17 32 34.5 55.5 17" fill="#FBDBD0" stroke="#374874" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
